<!DOCTYPE html>
<html lang="{{ site.lang | default: "en" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f8fafb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">

{% seo %}
    <link rel="icon" href="{{ "/images/logo.png" | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
    <link rel="stylesheet" href="{{ "/assets/css/site.css" | relative_url }}">
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="wrap bar">
        <a class="brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        <nav class="nav" aria-label="Primary">
          <a href="#work">Work</a>
          <a href="#projects">Projects</a>
          <a href="#experience">Experience</a>
          <a href="#skills">Skills</a>
        </nav>
        <a class="btn btn-sm" href="{{ "/pdf/Dristanta_Das_Senior_Data_Scientist.pdf" | relative_url }}" target="_blank" rel="noopener">Resume</a>
      </div>
    </header>

    <main id="main">
      {{ content }}
    </main>

    <footer class="site-footer" id="contact">
      <div class="wrap foot">
        <div>
          <p class="foot-lead">Open to senior data science and GenAI roles.</p>
          <a class="foot-mail" href="mailto:{{ site.email }}">{{ site.email }}</a>
        </div>
        <ul class="foot-links">
          <li><a href="https://www.linkedin.com/in/dasdristanta13/" target="_blank" rel="noopener">LinkedIn</a></li>
          <li><a href="https://github.com/dasdristanta13" target="_blank" rel="noopener">GitHub</a></li>
          <li><a href="{{ "/pdf/Dristanta_Das_Senior_Data_Scientist.pdf" | relative_url }}" target="_blank" rel="noopener">Resume (PDF)</a></li>
        </ul>
      </div>
      <div class="wrap legal">&copy; {{ site.time | date: "%Y" }} {{ site.author }}</div>
    </footer>
  </body>
</html>
